# XcodeGen spec. `xcodegen generate` turns this into Haru.xcodeproj.
# The .xcodeproj is deliberately not checked in: this file is the source of truth
# and is far easier to review than a pbxproj.
name: Haru
options:
  bundleIdPrefix: com.toomiiverse
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  Haru:
    type: application
    platform: iOS
    sources:
      - path: Haru/Sources
      - path: Haru/Assets.xcassets
    info:
      path: Haru/Info.plist
      properties:
        CFBundleDisplayName: Haru
        CFBundleName: Haru
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "So you can talk to her instead of typing."
        NSLocationWhenInUseUsageDescription: "So she knows roughly where you are, if you let her. Off unless you switch it on."
        NSPhotoLibraryUsageDescription: "To send her a picture."
        BGTaskSchedulerPermittedIdentifiers:
          - com.toomiiverse.haru.refresh
        UIBackgroundModes:
          - fetch
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toomiiverse.haru
        PRODUCT_NAME: Haru
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: "NO"
schemes:
  Haru:
    build:
      targets:
        Haru: all
    run:
      config: Debug
    archive:
      config: Release
