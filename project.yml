# XcodeGen spec. `xcodegen generate` turns this into Haru.xcodeproj.
# The .xcodeproj is deliberately not checked in: this file is the source of truth
# and is far easier to review than a pbxproj.
name: Haru
options:
  bundleIdPrefix: com.toomiiverse
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
# "Hey Haru" heard by the model trained on it (Services/WakeModel.swift):
# livekit-wakeword bundles openWakeWord's front end and runs the classifier
# through ONNX Runtime. Only its main branch has a root Package.swift.
packages:
  LiveKitWakeWord:
    url: https://github.com/livekit/livekit-wakeword
    # Pinned: `branch: main` re-resolved on every CI run, so the same source
    # shipped a different onnxruntime between builds 60 and 62 (2026-09-18).
    revision: 95448a7559c453fcd87645bd67b247ffb45f85b0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  Haru:
    type: application
    platform: iOS
    sources:
      - path: Haru/Sources
      - path: Haru/Assets.xcassets
      - path: Haru/Resources
        excludes:
          - "kws/**"
      # The "Hey Haru" model (WakeSpotter.swift), put here by scripts/build-ipa.sh:
      # a folder reference, so it lands in the bundle as kws/ with its names.
      - path: Haru/Resources/kws
        type: folder
        buildPhase: resources
        optional: true
    info:
      path: Haru/Info.plist
      properties:
        CFBundleDisplayName: Haru
        CFBundleName: Haru
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iPhone-only and portrait-only; without this App Store Connect demands
        # all four orientations for iPad multitasking.
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        # Her ear on the lock screen and in the Dynamic Island (Services/Live.swift).
        NSSupportsLiveActivities: true
        # Her pushes arrive as messages from her (HaruNotify): iOS wants the intent named here.
        NSUserActivityTypes:
          - INSendMessageIntent
        # "Ring like an alarm" under More (WakeAlarm.swift, iOS 26).
        NSAlarmKitUsageDescription: "To wake you at the hour you set, in her voice, even on silent."
        # haru://chat, haru://talk, haru://status … — for Shortcuts, the Action
        # button and Safari. Handled in HaruApp (onOpenURL → Navigator).
        CFBundleURLTypes:
          - CFBundleURLName: com.toomiiverse.haru
            CFBundleURLSchemes:
              - haru
        NSMicrophoneUsageDescription: "So you can talk to her instead of typing."
        NSLocationWhenInUseUsageDescription: "So she knows roughly where you are, if you let her. Off unless you switch it on."
        # "With the app closed too" under More (Locator.swift): significant changes and visits only.
        NSLocationAlwaysAndWhenInUseUsageDescription: "So she can tell when you have got somewhere or left it, even with the app closed. Off unless you switch it on."
        NSPhotoLibraryUsageDescription: "To send her a picture."
        NSCameraUsageDescription: "To take a picture for her."
        NSHealthShareUsageDescription: "So she can notice how you slept and how far you walked, if you let her. Off unless you switch it on."
        # Required by Apple beside the read string whenever the HealthKit entitlement is present; the app never writes.
        NSHealthUpdateUsageDescription: "Haru only reads. Nothing is written to Health."
        # Her list mirrored into a "Haru" list in Reminders, both ways (Reminders.swift). Off unless you switch it on.
        NSRemindersFullAccessUsageDescription: "To keep her list in Reminders: a Haru list that matches hers, both ways. Off unless you switch it on."
        NSRemindersUsageDescription: "To keep her list in Reminders: a Haru list that matches hers, both ways. Off unless you switch it on."
        BGTaskSchedulerPermittedIdentifiers:
          - com.toomiiverse.haru.refresh
        UIBackgroundModes:
          - fetch
          - audio
          - location
          - remote-notification
    dependencies:
      - target: HaruWidget
      - target: HaruShare
      - target: HaruNotify
      - package: LiveKitWakeWord
        product: LiveKitWakeWord
      # sherpa-onnx, fetched by scripts/build-ipa.sh — see WakeSpotter.swift.
      - framework: Vendor/SherpaOnnxC.xcframework
        embed: true
    settings:
      base:
        # Apple registered the App ID with the Team ID as a suffix (2026-09-04);
        # the app matches it. The BG task identifier below is unrelated to this.
        PRODUCT_BUNDLE_IDENTIFIER: com.toomiiverse.haru.JF3928RYMD
        PRODUCT_NAME: Haru
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Haru/Haru.entitlements
        # Set by the signed build from the APPLE_TEAM_ID secret; empty for the unsigned one.
        DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: "NO"
        # The script below deletes inside the built app; the sandbox forbids that.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    postBuildScripts:
      # LiveKitWakeWord depends on Microsoft's onnxruntime Swift package, whose
      # iOS "framework" is a static archive in a framework folder (checked
      # 2026-09-18: pod-archive-onnxruntime-c-1.24.2, ios-arm64 slice is an ar
      # archive). It is linked into Haru itself, yet Xcode also copies it into
      # Frameworks/, and App Store Connect rejects an app with a static library
      # there during processing — by email only, with no build in TestFlight.
      # Builds 60–62 vanished that way. Drop the copy; the code is already in.
      - name: Drop the static onnxruntime copy
        script: |
          fw="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}/onnxruntime.framework"
          if [ -d "$fw" ]; then rm -rf "$fw"; echo "removed static $fw"; fi
        basedOnDependencyAnalysis: false
  # Her on the home and lock screens. Shares the status types, the mood
  # look and the App Group bridge with the app; everything else is its own.
  HaruWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: HaruWidget/Sources
      - path: Haru/Sources/Model/Models.swift
      - path: Haru/Sources/Model/JSONValue.swift
      - path: Haru/Sources/Model/MoodLook.swift
      - path: Haru/Sources/Model/Shared.swift
      # The controls' intents run in the app but are declared to both (Controls.swift).
      - path: Haru/Sources/Intents/ControlIntents.swift
      # What the Live Activity shows; the app keeps it, the extension draws it.
      - path: Haru/Sources/Model/LiveStatus.swift
    info:
      path: HaruWidget/Info.plist
      properties:
        CFBundleDisplayName: Haru
        CFBundleName: HaruWidget
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toomiiverse.haru.JF3928RYMD.widget
        PRODUCT_NAME: HaruWidget
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: HaruWidget/HaruWidget.entitlements
        DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"
        SUPPORTS_MACCATALYST: "NO"
  # "Share to Haru" from any app's share sheet: a link, text or a picture,
  # with a line of your own, into the chat. Shares the App Group bridge.
  HaruShare:
    type: app-extension
    platform: iOS
    sources:
      - path: HaruShare/Sources
      - path: Haru/Sources/Model/Models.swift
      - path: Haru/Sources/Model/JSONValue.swift
      - path: Haru/Sources/Model/Shared.swift
    info:
      path: HaruShare/Info.plist
      properties:
        CFBundleDisplayName: Haru
        CFBundleName: HaruShare
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toomiiverse.haru.JF3928RYMD.share
        PRODUCT_NAME: HaruShare
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: HaruShare/HaruShare.entitlements
        DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"
        SUPPORTS_MACCATALYST: "NO"
  # Every push passes through here first and comes out as a message from her
  # (NotificationService.swift). No App Group: see Portrait there.
  HaruNotify:
    type: app-extension
    platform: iOS
    sources:
      - path: HaruNotify/Sources
    info:
      path: HaruNotify/Info.plist
      properties:
        CFBundleDisplayName: Haru
        CFBundleName: HaruNotify
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toomiiverse.haru.JF3928RYMD.notify
        PRODUCT_NAME: HaruNotify
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"
        SUPPORTS_MACCATALYST: "NO"
schemes:
  Haru:
    build:
      targets:
        Haru: all
    run:
      config: Debug
    archive:
      config: Release
