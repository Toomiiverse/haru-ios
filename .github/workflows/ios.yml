# Builds an unsigned .ipa on GitHub's macOS runner, for a household with no Mac.
# Download the artifact from the run and sideload it (README, "Without a Mac").
name: iOS build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Pick Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | tail -1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Haru.xcodeproj -scheme Haru -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            | tail -60
      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Haru.app Payload/
          zip -qr Haru-unsigned.ipa Payload
          ls -la Haru-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Haru-unsigned-ipa
          path: Haru-unsigned.ipa
