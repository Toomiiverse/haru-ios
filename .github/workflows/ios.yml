# Builds an unsigned .ipa on GitHub's macOS runner, for a household with no Mac.
# Download the artifact from the run and sideload it (README, "Without a Mac").
# All the work is in scripts/build-ipa.sh; this file should not need to change.
name: iOS build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: bash scripts/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Haru-unsigned-ipa
          path: Haru-unsigned.ipa
